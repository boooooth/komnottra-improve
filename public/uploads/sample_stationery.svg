<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%">
  <defs>
    <filter id="paper-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Paper -->
  <rect x="20" y="20" width="360" height="610" rx="8" fill="#FFFDF8" stroke="#E2E8F0" stroke-width="1.5" filter="url(#paper-shadow)"/>
  
  <!-- Header -->
  <text x="200" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0F172A">STATIONERY WORLD CO., LTD</text>
  <text x="200" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Preah Monivong Blvd, Phnom Penh, Cambodia</text>
  <text x="200" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Tel: 023-889-123 / 012-998-776</text>
  <text x="200" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#7C2D12">OFFICIAL TAX INVOICE / វិក្កយបត្រពន្ធ</text>
  
  <line x1="40" y1="140" x2="360" y2="140" stroke="#CBD5E1" stroke-dasharray="4,4"/>
  
  <!-- Metadata -->
  <text x="40" y="165" font-family="monospace" font-size="12" fill="#334155">Invoice No: <tspan font-weight="700">INV-0451</tspan></text>
  <text x="360" y="165" text-anchor="end" font-family="monospace" font-size="12" fill="#334155">Date: 23/09/2026</text>
  <text x="40" y="188" font-family="monospace" font-size="12" fill="#334155">Vendor TIN: <tspan font-weight="700" fill="#1E293B">K001-100234567</tspan></text>
  <text x="40" y="210" font-family="monospace" font-size="12" fill="#334155">Cashier: Sophea (POS 1)</text>
  <text x="360" y="210" text-anchor="end" font-family="monospace" font-size="12" fill="#334155">Time: 10:42 AM</text>
  
  <line x1="40" y1="225" x2="360" y2="225" stroke="#94A3B8"/>
  
  <!-- Table Header -->
  <text x="40" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569">ITEM</text>
  <text x="250" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569">QTY</text>
  <text x="360" y="245" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569">AMOUNT (KHR)</text>
  
  <line x1="40" y1="255" x2="360" y2="255" stroke="#CBD5E1"/>
  
  <!-- Line Item -->
  <text x="40" y="280" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1E293B">HP LaserJet 85A Toner</text>
  <text x="40" y="296" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Original Cartridge (Black)</text>
  <text x="260" y="285" font-family="monospace" font-size="13" fill="#1E293B">1</text>
  <text x="360" y="285" text-anchor="end" font-family="monospace" font-size="13" font-weight="600" fill="#1E293B">87,273</text>
  
  <line x1="40" y1="330" x2="360" y2="330" stroke="#CBD5E1" stroke-dasharray="4,4"/>
  
  <!-- Calculation Breakdown -->
  <text x="40" y="360" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Subtotal excl. VAT:</text>
  <text x="360" y="360" text-anchor="end" font-family="monospace" font-size="13" fill="#334155">87,273 KHR</text>
  
  <text x="40" y="385" font-family="system-ui, sans-serif" font-size="13" fill="#475569">VAT (10% / អតប):</text>
  <text x="360" y="385" text-anchor="end" font-family="monospace" font-size="13" fill="#334155">8,727 KHR</text>
  
  <line x1="40" y1="405" x2="360" y2="405" stroke="#0F172A" stroke-width="1.5"/>
  
  <text x="40" y="435" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">TOTAL / សរុប:</text>
  <text x="360" y="435" text-anchor="end" font-family="monospace" font-size="18" font-weight="800" fill="#0F172A">96,000 KHR</text>
  
  <text x="40" y="465" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Payment Method: Cash (សាច់ប្រាក់)</text>
  <text x="360" y="465" text-anchor="end" font-family="monospace" font-size="12" fill="#166534" font-weight="600">PAID IN FULL</text>
  
  <!-- Barcode / Footer -->
  <rect x="80" y="500" width="240" height="40" fill="#1E293B" rx="4"/>
  <text x="200" y="525" text-anchor="middle" font-family="monospace" font-size="13" fill="#FFFFFF" letter-spacing="4">*INV-0451-96000*</text>
  
  <text x="200" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Thank you for your business! សូមអរគុណ!</text>
</svg>
