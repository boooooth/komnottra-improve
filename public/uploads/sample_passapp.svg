<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%">
  <defs>
    <filter id="passapp-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="20" y="20" width="360" height="610" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#passapp-shadow)"/>
  
  <!-- PassApp Header -->
  <rect x="20" y="20" width="360" height="100" rx="16" fill="#F59E0B"/>
  <rect x="20" y="80" width="360" height="40" fill="#F59E0B"/>
  <text x="200" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">PassApp Ride</text>
  <text x="200" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FEF3C7">Electronic Trip Receipt</text>
  
  <!-- Trip Fare Badge -->
  <text x="200" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">TOTAL FARE PAID</text>
  <text x="200" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#0F172A">$8.70 <tspan font-size="18" font-weight="500" fill="#64748B">USD</tspan></text>
  <text x="200" y="230" text-anchor="middle" font-family="monospace" font-size="13" fill="#059669">Paid via ABA KHQR (35,670 KHR equiv.)</text>
  
  <line x1="40" y1="250" x2="360" y2="250" stroke="#F1F5F9" stroke-width="2"/>
  
  <!-- Trip Details -->
  <text x="40" y="280" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">BOOKING REFERENCE</text>
  <text x="360" y="280" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A">PA-88213</text>
  
  <text x="40" y="310" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">DATE &amp; TIME</text>
  <text x="360" y="310" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#334155">24/09/2026, 08:15 AM</text>
  
  <text x="40" y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">DRIVER</text>
  <text x="360" y="340" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Samnang P. (TukTuk #2B-8911)</text>
  
  <text x="40" y="370" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">DISTANCE</text>
  <text x="360" y="370" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#334155">14.2 km (Airport Transfer)</text>
  
  <!-- Locations -->
  <rect x="40" y="395" width="320" height="90" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="60" cy="425" r="5" fill="#10B981"/>
  <text x="75" y="429" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Phnom Penh International Airport</text>
  <line x1="60" y1="432" x2="60" y2="455" stroke="#CBD5E1" stroke-dasharray="2,2"/>
  <circle cx="60" cy="460" r="5" fill="#EF4444"/>
  <text x="75" y="464" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1E293B">Head Office, BKK1, Phnom Penh</text>
  
  <!-- Tax Note -->
  <rect x="40" y="505" width="320" height="45" rx="6" fill="#FEF3C7"/>
  <text x="50" y="525" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#92400E">Tax Notice: Informal Transport Slip (No TIN)</text>
  <text x="50" y="540" font-family="system-ui, sans-serif" font-size="10" fill="#B45309">Non-creditable VAT input (Claimed as internal travel expense)</text>
  
  <text x="200" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">PassApp Technologies (Cambodia) Ltd.</text>
</svg>
